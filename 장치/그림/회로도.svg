<line x1="568" y1="460" x2="600" y2="460"/><text x="592" y="474" font-size="10" text-anchor="end" fill="#000" stroke="none">3</text>
<line x1="568" y1="460" x2="568" y2="500"/><use href="#gnd" x="568" y="500"/>

<line x1="664" y1="445" x2="756" y2="445"/><circle cx="756" cy="445" r="3.5" fill="#000"/>
