<text x="52" y="626" font-size="11" text-anchor="end" fill="#000" stroke="none">접지 전극</text>
<use href="#gnd" x="150" y="620"/>

<circle cx="100" cy="430" r="3.5" fill="#000"/><line x1="100" y1="430" x2="100" y2="468"/><path d="M 100 468 A 6 6 0 0 1 100 480"/><line x1="100" y1="480" x2="100" y2="512"/><rect x="90" y="512" width="20" height="38"/><line x1="100" y1="550" x2="100" y2="576"/>
