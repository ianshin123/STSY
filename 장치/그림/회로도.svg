<text x="176" y="536" font-size="10.5" fill="#000" stroke="none">Rb2</text>
<use href="#gnd" x="150" y="576"/>

<rect x="196" y="398" width="140" height="108"/>
<text x="266" y="434" font-size="13" font-weight="700" text-anchor="middle" fill="#000" stroke="none">AD623</text>
