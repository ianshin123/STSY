<text x="64" y="84" font-size="13" fill="#000" stroke="none">+</text>
<text x="64" y="156" font-size="13" fill="#000" stroke="none">−</text>

<line x1="108" y1="80" x2="1030" y2="80"/>
<line x1="108" y1="148" x2="150" y2="148"/><line x1="150" y1="148" x2="150" y2="280"/><line x1="150" y1="280" x2="1030" y2="280"/>
