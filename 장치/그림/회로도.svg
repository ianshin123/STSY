<line x1="336" y1="486" x2="368" y2="486"/><circle cx="368" cy="486" r="3.5" fill="#000"/><text x="376" y="490" font-size="10.5" fill="#000" stroke="none">REF → GND</text>

<line x1="212" y1="506" x2="212" y2="560"/><line x1="212" y1="560" x2="238" y2="560"/>
<rect x="238" y="550" width="56" height="20"/><line x1="266" y1="596" x2="266" y2="574"/><path d="M 260 580 L 266 570 L 272 580 Z" fill="#000"/><text x="266" y="614" font-size="10.5" text-anchor="middle" fill="#000" stroke="none">이득 트리머</text>
<line x1="294" y1="560" x2="320" y2="560"/><line x1="320" y1="560" x2="320" y2="506"/>
<text x="330" y="590" font-size="10.5" fill="#000" stroke="none">이득 트리머가 모듈에 달려 있다.</text><text x="330" y="606" font-size="10.5" fill="#000" stroke="none">RG 저항을 따로 꽂지 않는다.</text>

<!-- 1단 → 2단 -->
<line x1="336" y1="430" x2="400" y2="430"/>
<line x1="400" y1="418" x2="400" y2="442"/><line x1="410" y1="418" x2="410" y2="442"/>
