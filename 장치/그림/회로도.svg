<text x="856" y="454" font-size="10.5" text-anchor="middle" fill="#000" stroke="none">프로브 1X · AC 결합</text>
<text x="856" y="472" font-size="10.5" text-anchor="middle" fill="#000" stroke="none">반드시 배터리 구동</text>
<line x1="800" y1="486" x2="800" y2="516"/><use href="#gnd" x="800" y="516"/>
<text x="818" y="524" font-size="10.5" fill="#000" stroke="none">접지 클립 → GND 레일</text>

<!-- ================= 주석 ================= -->
<rect x="40" y="700" width="480" height="76" stroke-dasharray="6 4"/>
<text x="56" y="722" font-size="10.5" fill="#000" stroke="none">패러데이 케이지 (알루미늄 호일) — 악어클립으로 GND 레일에 연결한다.</text>
<text x="56" y="742" font-size="10.5" fill="#000" stroke="none">지렁이 · 전극 · 1단을 이 안에 둔다.</text>
<text x="56" y="762" font-size="10.5" fill="#000" stroke="none">회로와 오실로스코프를 모두 배터리로 구동한다.</text>

<text x="560" y="716" font-size="10.5" fill="#000" stroke="none">Rb1 · Rb2 는 입력 바이어스 전류가 흐를 직류 경로다.</text>
<text x="560" y="736" font-size="10.5" fill="#000" stroke="none">AD623 데이터시트 p.27 — 부동 입력원을 증폭할 때는</text>
<text x="560" y="756" font-size="10.5" fill="#000" stroke="none">각 입력에 직류 경로가 반드시 있어야 한다.</text>
<text x="560" y="776" font-size="10.5" fill="#000" stroke="none">모든 GND 기호는 같은 GND 레일이다.</text>
</g>
</svg>
