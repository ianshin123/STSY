<text x="260" y="841" font-size="19" font-weight="700" fill="#111" text-anchor="start">모듈 (기판)</text>
<text x="450" y="841" font-size="17" font-weight="400" fill="#444" text-anchor="start">AD623 — 위아래 금색 점이 납땜할 핀 자리다</text>
<text x="70" y="898" font-size="17" font-weight="700" fill="#c0392b" text-anchor="start">★ 도면 색은 도면 안에서만 통하는 약속이다. 우리 저항은 1 % 금속피막이라 실물은 파란 몸통일 수 있다.</text>
