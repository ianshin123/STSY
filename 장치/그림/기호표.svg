<text x="1470" y="670" font-size="18" font-weight="700" fill="#111" text-anchor="start">건전지 스냅 — 9 V 건전지 ↔ 레일</text>
<text x="1470" y="696" font-size="17" font-weight="400" fill="#2a7a45" text-anchor="start">9 V 건전지 스냅 홀더 (점퍼선 타입) 2개</text>
