<text x="1470" y="368" font-size="18" font-weight="700" fill="#111" text-anchor="start">암–수 점퍼선 — 이번 회로에서는 쓰지 않는다</text>
<text x="1470" y="394" font-size="17" font-weight="400" fill="#2a7a45" text-anchor="start">시침핀에는 암 커넥터가 안 물린다 (40개 보유)</text>
<rect x="1248" y="428" width="1104" height="88" rx="8" fill="#fff" stroke="#e2e2e2"/>
<g transform="translate(1288,472) rotate(90)"><rect x="-10" y="-19" width="20" height="38" rx="3" fill="#262626"/><rect x="-4.5" y="-15" width="9" height="10" rx="1.5" fill="#8f8f8f"/><rect x="-10" y="8" width="20" height="5" fill="#4a4a4a"/></g>
<line x1="1300" y1="472.0" x2="1400" y2="472.0" stroke="#9a9a9a" stroke-width="8" stroke-linecap="round"/>
<g transform="translate(1412,472) rotate(90)"><rect x="-10" y="-19" width="20" height="38" rx="3" fill="#262626"/><rect x="-4.5" y="-15" width="9" height="10" rx="1.5" fill="#8f8f8f"/><rect x="-10" y="8" width="20" height="5" fill="#4a4a4a"/></g>
<text x="1470" y="466" font-size="18" font-weight="700" fill="#111" text-anchor="start">암–암 점퍼선 — 수핀 ↔ 수핀</text>
<text x="1470" y="492" font-size="17" font-weight="400" fill="#2a7a45" text-anchor="start">수–수가 모자랄 때 이어 늘린다 (20개 보유)</text>
<rect x="1248" y="526" width="1104" height="96" rx="8" fill="#fff" stroke="#e2e2e2"/>
<line x1="1310" y1="534.0" x2="1310" y2="614.0" stroke="#a0a0a0" stroke-width="5"/>
