<svg xmlns="http://www.w3.org/2000/svg" width="2420" height="1570" viewBox="0 0 2420 1570" font-family="Noto Sans CJK KR, sans-serif"><rect width="2420" height="1570" fill="#fff"/>
<text x="50" y="66" font-size="36" font-weight="700" fill="#111" text-anchor="start">전체 연결도 기호표 — 그림의 무엇이 실물의 무엇인가</text>
<text x="50" y="104" font-size="19" font-weight="400" fill="#555" text-anchor="start">2026년 8월 28일 · 「그림/전체연결도.png」 와 같이 본다.</text>
<rect x="50" y="170" width="1130" height="360" rx="14" fill="#fbfbf9" stroke="#c9c9c2" stroke-width="2"/>
<text x="66" y="156" font-size="25" font-weight="700" fill="#111" text-anchor="start">A.  선 색 = 실물의 종류 (역할이 아니다)</text>
<text x="70" y="204" font-size="17" font-weight="700" fill="#c0392b" text-anchor="start">색은 「무엇으로 만든 연결인가」를 나타낸다. 역할(V+ · V− · GND · 신호)은 색이 아니라 이름표와 결선표에 적었다.</text>
<line x1="80" y1="246" x2="180" y2="246" stroke="#1a5fb4" stroke-width="9" stroke-linecap="round"/>
<text x="202" y="253" font-size="19" font-weight="700" fill="#111" text-anchor="start">수–수 점퍼선</text>
<text x="470" y="253" font-size="17" font-weight="400" fill="#333" text-anchor="start">보드 구멍 ↔ 보드 구멍. 회로 안쪽 배선 전부 · 19개</text>
<line x1="80" y1="294" x2="180" y2="294" stroke="#0f9b8e" stroke-width="9" stroke-linecap="round"/>
<text x="202" y="301" font-size="19" font-weight="700" fill="#111" text-anchor="start">악어클립 테스트 리드선</text>
<text x="470" y="301" font-size="17" font-weight="400" fill="#333" text-anchor="start">양끝이 악어입. 전극 3개 + 케이지 1개</text>
<line x1="80" y1="342" x2="180" y2="342" stroke="#8e44ad" stroke-width="9" stroke-linecap="round"/>
<text x="202" y="349" font-size="19" font-weight="700" fill="#111" text-anchor="start">건전지 스냅 연선</text>
<text x="470" y="349" font-size="17" font-weight="400" fill="#333" text-anchor="start">실물의 두 선은 빨강·검정이다. 빨강 → V+, 검정 → V−</text>
<line x1="80" y1="390" x2="180" y2="390" stroke="#2f2f2f" stroke-width="9" stroke-linecap="round"/>
<text x="202" y="397" font-size="19" font-weight="700" fill="#111" text-anchor="start">오실로스코프 프로브</text>
<text x="470" y="397" font-size="17" font-weight="400" fill="#333" text-anchor="start">동축 케이블과 접지선. 프로브에 붙어 있다</text>
<line x1="80" y1="438" x2="180" y2="438" stroke="#9a9a9a" stroke-width="9" stroke-linecap="round"/>
<text x="202" y="445" font-size="19" font-weight="700" fill="#111" text-anchor="start">회색 = 부품 다리 · 시침핀</text>
<text x="470" y="445" font-size="17" font-weight="400" fill="#333" text-anchor="start">저항 · 커패시터의 다리, 그리고 강선</text>
<line x1="80" y1="488" x2="180" y2="488" stroke="#e2a8a8" stroke-width="4"/>
<line x1="80" y1="500" x2="180" y2="500" stroke="#aab8dd" stroke-width="4"/>
<text x="202" y="500" font-size="19" font-weight="700" fill="#111" text-anchor="start">연한 빨강·파랑 줄</text>
<text x="470" y="500" font-size="17" font-weight="400" fill="#333" text-anchor="start">보드에 인쇄된 레일 표시. 전선이 아니다</text>
<rect x="1230" y="170" width="1140" height="1010" rx="14" fill="#fbfbf9" stroke="#c9c9c2" stroke-width="2"/>
<text x="1246" y="156" font-size="25" font-weight="700" fill="#111" text-anchor="start">B.  무엇으로 잇나  —  실물과 짝짓기</text>
<text x="1310" y="204" font-size="16" font-weight="700" fill="#999" text-anchor="start">그림</text>
<text x="1470" y="204" font-size="16" font-weight="700" fill="#999" text-anchor="start">쓰는 곳</text>
<text x="1470" y="222" font-size="16" font-weight="700" fill="#999" text-anchor="start">우리 목록의 무엇인가</text>
