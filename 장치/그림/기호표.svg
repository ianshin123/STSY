<text x="1470" y="1013" font-size="18" font-weight="700" fill="#111" text-anchor="start">시침핀 기둥 — 보드 구멍에 세워 꽂는다</text>
<text x="1470" y="1039" font-size="17" font-weight="400" fill="#2a7a45" text-anchor="start">훅·악어클립이 물 자리 6곳. 래핑와이어는 연선이라 못 쓴다</text>
<text x="1254" y="1150" font-size="17" font-weight="700" fill="#555" text-anchor="start">초록 글씨 = 이미 있다   ·   주황 글씨 = 확인이 필요하다</text>
