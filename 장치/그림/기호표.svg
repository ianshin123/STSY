<text x="270" y="1019" font-size="19" font-weight="700" fill="#111" text-anchor="start">검은 네모</text>
<text x="480" y="1019" font-size="17" font-weight="400" fill="#444" text-anchor="start">브레드보드 구멍. 한 열의 A–E 다섯 개가 속에서 이어져 있다</text>
<rect x="123.5" y="1081.5" width="13" height="13" rx="2" fill="#3a3a3a"/>
<rect x="153.5" y="1081.5" width="13" height="13" rx="2" fill="#3a3a3a"/>
<rect x="183.5" y="1081.5" width="13" height="13" rx="2" fill="#3a3a3a"/>
<circle cx="160" cy="1088" r="9" fill="#1a5fb4"/>
<text x="270" y="1095" font-size="19" font-weight="700" fill="#111" text-anchor="start">색 있는 동그라미</text>
<text x="480" y="1095" font-size="17" font-weight="400" fill="#444" text-anchor="start">선이나 부품 다리를 그 구멍에 꽂는다는 표시</text>
