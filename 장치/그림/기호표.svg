<text x="1470" y="270" font-size="18" font-weight="700" fill="#111" text-anchor="start">수–수 점퍼선 — 보드 구멍 ↔ 보드 구멍</text>
<text x="1470" y="296" font-size="17" font-weight="400" fill="#2a7a45" text-anchor="start">안쪽 17개 + 전극 끌어오기 2개 = 19개 (20개 보유)</text>
