<text x="1430" y="851" font-size="12" font-weight="700" fill="#666" text-anchor="middle">동축</text>
<text x="1364" y="935" font-size="12" font-weight="700" fill="#666" text-anchor="middle">접지선 + 악어클립</text>
<text x="1470" y="885" font-size="18" font-weight="700" fill="#111" text-anchor="start">오실로스코프 프로브 한 벌 — 훅 · 동축 케이블 · 접지선 · 악어클립</text>
<text x="1470" y="911" font-size="17" font-weight="400" fill="#c0392b" text-anchor="start">네 가지가 하나로 붙어 나온다. 스코프 상자에 있는지 확인할 것</text>
