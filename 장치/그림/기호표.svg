<text x="1470" y="568" font-size="18" font-weight="700" fill="#111" text-anchor="start">시침핀 + 악어클립 — 지렁이에 꽂는 전극</text>
<text x="1470" y="594" font-size="17" font-weight="400" fill="#2a7a45" text-anchor="start">장식 머리는 절연체다. 머리 아래 금속 축을 문다</text>
